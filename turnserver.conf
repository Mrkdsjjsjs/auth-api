# TURN Server Configuration for Shadowlum Messenger

# Network settings
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=85.239.52.213

# Realm
realm=shadowlum.local

# Authentication - using long-term credentials with REST API
lt-cred-mech
use-auth-secret

# Shared secret - will be replaced by entrypoint or set directly
# Must match TURN_SHARED_SECRET environment variable
static-auth-secret=super-secret-turn-key-change-me

# Relay settings - UDP port range for media
min-port=49152
max-port=65535

# Enable fingerprint for better compatibility
fingerprint

# Log settings
verbose
log-file=/var/log/turnserver/turn.log

# Performance settings
total-quota=100
user-quota=10

# Security
no-multicast-peers
no-cli

# Allow loopback for testing (can disable in production)
# allow-loopback-peers

# Mobility support for mobile clients
mobility

# No TLS for now (nginx handles SSL termination)
# For direct TLS, uncomment and provide certs:
# cert=/etc/ssl/certs/turn.pem
# pkey=/etc/ssl/private/turn.key
