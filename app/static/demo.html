<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Auth API - Interactive Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); min-height: 100vh; color: #f0f6fc; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 42px; background: linear-gradient(135deg, #58a6ff, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: #8b949e; font-size: 18px; }
        .demo-container { background: #0d1117; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #30363d; }
        .terminal-header { background: linear-gradient(90deg, #21262d, #161b22); padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #30363d; }
        .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
        .btn-red { background: #f85149; } .btn-yellow { background: #d29922; } .btn-green { background: #3fb950; }
        .terminal-title { flex: 1; text-align: center; color: #8b949e; font-size: 13px; }
        .terminal-body { padding: 20px; min-height: 400px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; overflow-y: auto; max-height: 500px; }
        .line { margin: 8px 0; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; }
        .line.visible { opacity: 1; transform: translateY(0); }
        .prompt { color: #3fb950; }
        .command { color: #58a6ff; }
        .comment { color: #8b949e; font-style: italic; }
        .response { color: #f0f6fc; background: #161b22; padding: 12px; border-radius: 8px; margin: 8px 0; border-left: 3px solid #58a6ff; white-space: pre-wrap; }
        .response.success { border-left-color: #3fb950; }
        .json-key { color: #ff7b72; } .json-string { color: #a5d6ff; } .json-number { color: #79c0ff; }
        .controls { display: flex; justify-content: center; gap: 16px; margin-top: 30px; }
        .btn { padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; border: none; display: flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #58a6ff, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(88,166,255,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #21262d; color: #f0f6fc; border: 1px solid #30363d; }
        .progress-bar { height: 4px; background: #21262d; border-radius: 2px; margin-top: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #58a6ff, #a855f7); width: 0%; transition: width 0.5s ease; }
        .step-indicator { display: flex; justify-content: center; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0.4; transition: all 0.3s ease; }
        .step.active, .step.completed { opacity: 1; }
        .step-icon { width: 40px; height: 40px; border-radius: 50%; background: #21262d; border: 2px solid #30363d; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .step.active .step-icon { border-color: #58a6ff; background: rgba(88,166,255,0.1); }
        .step.completed .step-icon { border-color: #3fb950; background: rgba(63,185,80,0.1); }
        .step-label { font-size: 12px; color: #8b949e; }
        .typing-cursor { display: inline-block; width: 8px; height: 16px; background: #58a6ff; animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .back-link { text-align: center; margin-top: 40px; }
        .back-link a { color: #58a6ff; text-decoration: none; margin: 0 10px; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Interactive API Demo</h1>
            <p class="subtitle">Watch how to use Auth API step by step</p>
        </header>
        <div class="demo-container">
            <div class="terminal-header">
                <div class="terminal-btn btn-red"></div>
                <div class="terminal-btn btn-yellow"></div>
                <div class="terminal-btn btn-green"></div>
                <div class="terminal-title">Terminal — Auth API Demo</div>
            </div>
            <div class="terminal-body" id="terminal"></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="step-indicator">
            <div class="step" data-step="0"><div class="step-icon">📝</div><div class="step-label">Register</div></div>
            <div class="step" data-step="1"><div class="step-icon">🔓</div><div class="step-label">Login</div></div>
            <div class="step" data-step="2"><div class="step-icon">👤</div><div class="step-label">Get User</div></div>
            <div class="step" data-step="3"><div class="step-icon">🔄</div><div class="step-label">Refresh</div></div>
            <div class="step" data-step="4"><div class="step-icon">✅</div><div class="step-label">Done!</div></div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" id="restartBtn" style="display:none">🔄 Restart</button>
            <button class="btn btn-primary" id="playBtn">▶️ Start Demo</button>
        </div>
        <div class="back-link">
            <a href="/">← Back to Home</a>
            <a href="/docs">📚 Swagger Docs</a>
            <a href="/redoc">📖 ReDoc</a>
        </div>
    </div>
    <script>
        const API = location.origin;
        const steps = [
            { lines: [
                {t:'comment',x:'# Step 1: Register a new user'},
                {t:'cmd',x:'curl -X POST '+API+'/auth/register \\'},
                {t:'cmd',x:'  -H "Content-Type: application/json" \\'},
                {t:'cmd',x:'  -d \'{"email":"demo@example.com","password":"secret123"}\''},
                {t:'resp',c:'success',x:'{"id":"a1b2c3d4...","email":"demo@example.com","created_at":"2024-01-15T10:30:00"}'},
                {t:'comment',x:'# ✅ User created!'}
            ]},
            { lines: [
                {t:'comment',x:'# Step 2: Login to get tokens'},
                {t:'cmd',x:'curl -X POST '+API+'/auth/login \\'},
                {t:'cmd',x:'  -H "Content-Type: application/json" \\'},
                {t:'cmd',x:'  -d \'{"email":"demo@example.com","password":"secret123"}\''},
                {t:'resp',c:'success',x:'{"access_token":"eyJhbG...","refresh_token":"eyJhbG...","token_type":"bearer"}'},
                {t:'comment',x:'# 🔑 Save these tokens!'}
            ]},
            { lines: [
                {t:'comment',x:'# Step 3: Access protected endpoint'},
                {t:'cmd',x:'curl -X GET '+API+'/auth/me \\'},
                {t:'cmd',x:'  -H "Authorization: Bearer eyJhbG..."'},
                {t:'resp',c:'success',x:'{"id":"a1b2c3d4...","email":"demo@example.com","created_at":"2024-01-15T10:30:00"}'},
                {t:'comment',x:'# 👤 User data retrieved!'}
            ]},
            { lines: [
                {t:'comment',x:'# Step 4: Refresh expired tokens'},
                {t:'cmd',x:'curl -X POST '+API+'/auth/refresh \\'},
                {t:'cmd',x:'  -H "Content-Type: application/json" \\'},
                {t:'cmd',x:'  -d \'{"refresh_token":"eyJhbG..."}\''},
                {t:'resp',c:'success',x:'{"access_token":"eyJhbG...NEW","refresh_token":"eyJhbG...NEW","token_type":"bearer"}'},
                {t:'comment',x:'# 🔄 New tokens received!'}
            ]},
            { lines: [
                {t:'comment',x:'# ✨ Demo Complete!'},
                {t:'comment',x:'#'},
                {t:'comment',x:'# You learned:'},
                {t:'comment',x:'#   📝 Register users'},
                {t:'comment',x:'#   🔓 Login & get JWT'},
                {t:'comment',x:'#   👤 Protected endpoints'},
                {t:'comment',x:'#   🔄 Token refresh'},
                {t:'comment',x:'#'},
                {t:'comment',x:'# 🚀 Try it at /docs!'}
            ]}
        ];
        let cur=0,playing=false;
        const term=document.getElementById('terminal'),prog=document.getElementById('progress'),playBtn=document.getElementById('playBtn'),restartBtn=document.getElementById('restartBtn');
        function updateSteps(){document.querySelectorAll('.step').forEach((e,i)=>{e.classList.remove('active','completed');if(i<cur)e.classList.add('completed');if(i===cur)e.classList.add('active');});prog.style.width=(cur/(steps.length-1))*100+'%';}
        function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
        async function typeText(el,txt){el.innerHTML='';const cursor=document.createElement('span');cursor.className='typing-cursor';el.appendChild(cursor);for(let i=0;i<txt.length;i++){if(!playing)return;el.insertBefore(document.createTextNode(txt[i]),cursor);await sleep(15);}cursor.remove();}
        async function showLine(l){const div=document.createElement('div');div.className='line';if(l.t==='cmd'){div.innerHTML='<span class="prompt">$</span> <span class="command"></span>';term.appendChild(div);setTimeout(()=>div.classList.add('visible'),50);await typeText(div.querySelector('.command'),l.x);}else if(l.t==='comment'){div.innerHTML='<span class="comment">'+l.x+'</span>';term.appendChild(div);setTimeout(()=>div.classList.add('visible'),50);}else if(l.t==='resp'){div.className='line response '+(l.c||'');div.textContent=l.x;term.appendChild(div);setTimeout(()=>div.classList.add('visible'),50);}await sleep(l.t==='resp'?400:150);term.scrollTop=term.scrollHeight;}
        async function play(){playing=true;playBtn.disabled=true;playBtn.innerHTML='⏸️ Playing...';restartBtn.style.display='none';term.innerHTML='';cur=0;updateSteps();for(let i=0;i<steps.length&&playing;i++){cur=i;updateSteps();for(const l of steps[i].lines){if(!playing)break;await showLine(l);}if(i<steps.length-1){await sleep(1200);term.innerHTML='';}}playing=false;playBtn.disabled=false;playBtn.innerHTML='▶️ Play Again';restartBtn.style.display='inline-flex';}
        playBtn.onclick=play;restartBtn.onclick=()=>{term.innerHTML='';cur=0;updateSteps();playBtn.innerHTML='▶️ Start Demo';restartBtn.style.display='none';};updateSteps();
    </script>
</body>
</html>
