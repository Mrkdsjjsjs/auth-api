name: CI/CD Pipeline

on:
  push:
    branches: [main, master, claude-scaffold]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude-scaffold'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/auth-api
            # Backup current version
            rm -rf /opt/auth-api/backup
            mkdir -p /opt/auth-api/backup
            cp -r app /opt/auth-api/backup/ 2>/dev/null || true
            cp requirements.txt /opt/auth-api/backup/ 2>/dev/null || true
            
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "app/,requirements.txt"
          target: "/opt/auth-api/"
          overwrite: true
          
      - name: Install deps and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/auth-api
            source venv/bin/activate
            pip install -r requirements.txt -q
            systemctl restart auth-api
            sleep 3
            # Smoke test
            curl -sf http://localhost:8000/health || (echo SMOKE_FAIL && /opt/auth-api/rollback.sh)
